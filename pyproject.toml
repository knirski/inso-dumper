[project]
name = "inso-dumper"
version = "0.1.0"
description = "Local backup tool for the Inso platform (app.inso.pl)"
requires-python = ">=3.14"
readme = "README.md"
dependencies = [
    "httpx>=0.27",
    "typer>=0.12",
    "rich>=13",
    "pydantic>=2.7",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
    "basedpyright>=1.13",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/inso_dumper"]

[project.scripts]
inso-dumper = "inso_dumper.cli:app"

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "RUF", "B", "SIM"]
ignore = [
    "E501",  # line length handled by formatter
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]  # allow assert in tests

[tool.basedpyright]
typeCheckingMode = "recommended"
pythonVersion = "3.14"
include = ["src", "tests"]
exclude = ["**/__pycache__"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"
